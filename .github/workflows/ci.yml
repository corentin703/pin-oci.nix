name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that runs offline without KVM: cargo test, clippy, rustfmt, nixfmt, module
  # evaluation tests, generated-unit script tests. Required on every PR.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build all checks except the NixOS VM tests
        run: |
          system=x86_64-linux
          mapfile -t checks < <(nix eval --json ".#checks.${system}" --apply builtins.attrNames \
            | jq -r --arg s "$system" '.[] | select(startswith("vm-") | not) | ".#checks.\($s).\(.)"')
          printf '%s\n' "${checks[@]}"
          nix build --print-build-logs --no-link "${checks[@]}"

  # NixOS VM tests against real podman and docker: need /dev/kvm, so they only run on main
  # or on demand, never as a PR gate.
  vm:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Run VM tests
        run: |
          nix build --print-build-logs --no-link \
            .#checks.x86_64-linux.vm-infra \
            .#checks.x86_64-linux.vm-projects
