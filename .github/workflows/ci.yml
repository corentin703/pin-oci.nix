name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that runs offline without KVM: cargo test, clippy, rustfmt, nixfmt, module
  # evaluation tests, generated-unit script tests. Required on every PR. Runs on x86_64 and on
  # aarch64 (native ARM runner); each one pushes what it builds to the Cachix cache.
  fast:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    name: fast (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        with:
          name: pin-oci
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build all checks except the NixOS VM tests
        run: |
          system=${{ matrix.system }}
          mapfile -t checks < <(nix eval --json ".#checks.${system}" --apply builtins.attrNames \
            | jq -r --arg s "$system" '.[] | select(startswith("vm-") | not) | ".#checks.\($s).\(.)"')
          printf '%s\n' "${checks[@]}"
          nix build --print-build-logs --no-link "${checks[@]}" ".#packages.${system}.pin-oci"

  # NixOS VM tests against real podman and docker: need /dev/kvm, so they only run on main
  # or on demand, never as a PR gate.
  vm:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v32
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        with:
          name: pin-oci
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run VM tests
        run: |
          # One test at a time: two tests in parallel mean four VMs on a 4-vCPU runner.
          nix build --max-jobs 1 --print-build-logs --no-link \
            .#checks.x86_64-linux.vm-infra \
            .#checks.x86_64-linux.vm-projects \
            .#checks.x86_64-linux.vm-rootless
