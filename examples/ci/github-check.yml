# Copy to .github/workflows/pin-oci-check.yml
#
# Fails a pull request when an image declared in your NixOS configuration is not in pin-oci.lock.
# `lock check` never contacts a registry and never writes anything.
name: pin-oci check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://pin-oci.cachix.org
            extra-trusted-public-keys = pin-oci.cachix.org-1:rnJNoJhMLyEkTckqap7U3sTpic1xvACQlpSNqFHTPys=
      # Without `#<host>` every host of the flake that enables pin-oci is checked.
      # Pin the CLI to a release tag, like any other input.
      - name: Check the lockfile
        run: nix run github:corentin703/pin-oci.nix/v0.4.0 -- lock check --flake .
